name: Waiver safety tests

on:
  push:
    branches:
      - main
      - safety/explicit-waiver-approval
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library safety tests
        run: python -m unittest discover -s tests -v
